  </g>

  <!-- Target circles -->
  <g transform="translate(20, 0)">
    <circle cx="50" cy="50" r="44" fill="#F8FAFC" stroke="#1E293B" stroke-width="4"/>
    <circle cx="50" cy="50" r="33" fill="#38BDF8" stroke="#1E293B" stroke-width="3"/>
    <circle cx="50" cy="50" r="22" fill="#F87171" stroke="#1E293B" stroke-width="3"/>
    <circle cx="50" cy="50" r="11" fill="#FDE047" stroke="#1E293B" stroke-width="3"/>
    <!-- Target cute face -->
    <circle cx="46" cy="48" r="2.2" fill="#1E293B"/>
    <circle cx="54" cy="48" r="2.2" fill="#1E293B"/>
    <path d="M 47,53 Q 50,56 53,53" fill="none" stroke="#1E293B" stroke-width="2" stroke-linecap="round"/>
    <!-- Blush -->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" id="mascotSvg">
  <defs>
    <linearGradient id="chickGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
    <filter id="mascotShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="0" flood-color="#854D0E" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Body -->
  <ellipse cx="60" cy="68" rx="42" ry="38" fill="url(#chickGrad)" stroke="#713F12" stroke-width="4" filter="url(#mascotShadow)"/>
  
  <!-- Wings -->
  <path d="M 18,65 Q 10,75 22,82 Q 26,72 24,65 Z" fill="#FACC15" stroke="#713F12" stroke-width="3" id="leftWing"/>
  <path d="M 102,65 Q 110,75 98,82 Q 94,72 96,65 Z" fill="#FACC15" stroke="#713F12" stroke-width="3" id="rightWing"/>

  <!-- Archer Band / Hat -->
  <path d="M 28,45 Q 60,35 92,45" fill="none" stroke="#16A34A" stroke-width="8" stroke-linecap="round"/>
  <!-- Feather in band -->
  <path d="M 35,42 Q 22,25 24,15 Q 35,28 35,38 Z" fill="#DC2626" stroke="#991B1B" stroke-width="2"/>

  <!-- Cute Eyes -->
  <g id="mascotEyes">
    <ellipse cx="46" cy="62" rx="7" ry="9" fill="#1E293B" />
    <ellipse cx="74" cy="62" rx="7" ry="9" fill="#1E293B" />
    <circle cx="44" cy="58" r="3.5" fill="#FFFFFF" />
    <circle cx="72" cy="58" r="3.5" fill="#FFFFFF" />
    <circle cx="48" cy="64" r="1.5" fill="#FFFFFF" />
    <circle cx="76" cy="64" r="1.5" fill="#FFFFFF" />
  </g>

  <!-- Cheeks -->
  <circle cx="35" cy="70" r="5.5" fill="#F43F5E" opacity="0.6"/>
  <circle cx="85" cy="70" r="5.5" fill="#F43F5E" opacity="0.6"/>

  <!-- Beak -->
  <path d="M 52,67 Q 60,63 68,67 Q 60,78 52,67 Z" fill="#EA580C" stroke="#713F12" stroke-width="2.5" id="mascotBeak"/>

  <!-- Little feet -->
  <path d="M 45,104 L 40,112 M 45,104 L 45,113 M 45,104 L 50,112" stroke="#EA580C" stroke-width="4" stroke-linecap="round"/>
  <path d="M 75,104 L 70,112 M 75,104 L 75,113 M 75,104 L 80,112" stroke="#EA580C" stroke-width="4" stroke-linecap="round"/>
</svg>

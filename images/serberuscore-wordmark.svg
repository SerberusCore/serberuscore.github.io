<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1500" height="390" viewBox="0 0 1500 390" role="img" aria-labelledby="title desc">
<title id="title">SerberusCore — wordmark</title>
<desc id="desc">Nombre SerberusCore en acero azul brillante, con letras firmes y eslogan Más que software. Fondo transparente.</desc>
<defs>
  <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#101d27"/>
    <stop offset="0.18" stop-color="#345265"/>
    <stop offset="0.36" stop-color="#7896a6"/>
    <stop offset="0.475" stop-color="#e8f1f4"/>
    <stop offset="0.515" stop-color="#ffffff"/>
    <stop offset="0.56" stop-color="#a9c0ca"/>
    <stop offset="0.74" stop-color="#4c6d80"/>
    <stop offset="1" stop-color="#142733"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#dce9ee"/>
    <stop offset="0.28" stop-color="#55788a"/>
    <stop offset="0.55" stop-color="#f8fcfd"/>
    <stop offset="1" stop-color="#274657"/>
  </linearGradient>
  <filter id="raised" x="-20%" y="-30%" width="140%" height="170%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur"/>
    <feOffset in="blur" dx="7" dy="9" result="offset"/>
    <feFlood flood-color="#03080c" flood-opacity="0.78" result="shadowColor"/>
    <feComposite in="shadowColor" in2="offset" operator="in" result="shadow"/>
    <feSpecularLighting in="blur" surfaceScale="4" specularConstant="0.85" specularExponent="28" lighting-color="#ffffff" result="shine">
      <feDistantLight azimuth="225" elevation="62"/>
    </feSpecularLighting>
    <feComposite in="shine" in2="SourceAlpha" operator="in" result="shineCut"/>
    <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/><feMergeNode in="shineCut"/></feMerge>
  </filter>

  <mask id="wordmark-mask" maskUnits="userSpaceOnUse" x="90" y="60" width="1320" height="150">
    <image x="90" y="60" width="1320" height="150" preserveAspectRatio="xMidYMid meet" href="data:image/png;base64," xlink:href="data:image/png;base64,"/>
  </mask>
</defs>
<rect x="90" y="60" width="1320" height="150" fill="url(#steel)" stroke="#0d1c26" stroke-width="3.2" mask="url(#wordmark-mask)" filter="url(#raised)"/>
<text x="750" y="323" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="650" letter-spacing="10" fill="#58788b" stroke="#d6e4e9" stroke-width="0.45" paint-order="stroke fill">MÁS QUE SOFTWARE</text>
</svg>